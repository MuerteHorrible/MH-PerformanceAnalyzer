<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MH Performance Analyzer report</title>
<style>
/* Printed railway working timetable: paper, ink, ruled columns, one signal red for breaches only.
   Line colours --s1 to --s3 and the red were checked together for colour-blind separation on each paper colour. */
:root {
  --paper: #F3F0E6;
  --ink: #1C1B19;
  --red: #B22A1F;
  --blue: #1F5FA8;
  --yellow: #A87A00;
  --rule: rgba(28, 27, 25, 0.22);
  --rule-strong: rgba(28, 27, 25, 0.55);
  --dim: rgba(28, 27, 25, 0.62);
  --faint: rgba(28, 27, 25, 0.08);
  --labelc: #4A5D73;
  --promptbg: #E4E1D7;
  --s1: #1F5FA8;
  --s2: #A87A00;
  --s3: #0B8A7A;
  --label: "Bahnschrift", "DIN Alternate", "DIN 2014", "Arial Narrow", sans-serif;
  --figure: "Consolas", "Cascadia Mono", "Menlo", ui-monospace, monospace;
}
/* Dark mode: same layout, inverted paper and ink. */
:root[data-theme="dark"] {
  --paper: #1A1916;
  --ink: #E9E5DA;
  --red: #E0475F;
  --blue: #7AAEEA;
  --yellow: #E0B84E;
  --rule: rgba(233, 229, 218, 0.20);
  --rule-strong: rgba(233, 229, 218, 0.50);
  --dim: rgba(233, 229, 218, 0.60);
  --faint: rgba(233, 229, 218, 0.08);
  --labelc: #9DB3CC;
  --promptbg: #262521;
  --s1: #3F74C8;
  --s2: #B8881E;
  --s3: #2E9E8E;
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body { margin: 0; padding: 0 18px 10px; height: 100vh; box-sizing: border-box; overflow: hidden; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); font: 14px/1.35 var(--label); font-variant-numeric: tabular-nums; }
.num, td.n, th.n, .fig { font-family: var(--figure); font-variant-numeric: tabular-nums; }
td.n, th.n { text-align: right; white-space: nowrap; }

/* Masthead */
.masthead { display: grid; grid-template-columns: auto 1fr auto; gap: 4px 22px; align-items: center; padding: 12px 0 6px; border-bottom: 2px solid var(--ink); }
.masthead .title { font-size: 22px; font-weight: 700; letter-spacing: .02em; }
.masthead .picker { display: flex; gap: 8px; align-items: center; }
.masthead .meta button.theme { border: none; background: none; padding: 0; font: inherit; color: var(--labelc); text-decoration: underline; text-underline-offset: 2px; }
.masthead .meta button.theme:hover { color: var(--ink); background: none; }
.masthead .meta { font-family: var(--figure); font-size: 12px; color: var(--dim); justify-self: end; text-align: right; }
.masthead label { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--labelc); }
select, button { font: 13px var(--label); color: var(--ink); background: var(--paper); border: 1px solid var(--rule-strong); border-radius: 0; padding: 3px 6px; }
button { cursor: pointer; letter-spacing: .04em; }
button:hover { background: var(--ink); color: var(--paper); }

/* Section index (tabs) */
nav { display: flex; flex-wrap: wrap; gap: 0 6px; padding: 6px 0; border-bottom: 1px solid var(--rule); font-size: 13px; }
nav button { border: none; border-left: 1px solid transparent; border-right: 1px solid transparent; background: none; padding: 2px 10px; color: var(--dim); }
nav button:hover { background: none; color: var(--ink); }
nav button.on { color: var(--ink); font-weight: 700; border-left-color: var(--ink); border-right-color: var(--ink); }

main { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; }
section.tab { display: none; padding-top: 12px; }
section.tab.on { display: block; flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-gutter: stable; }
h2 { color: var(--labelc); font-size: 12px; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; margin: 0 0 4px; padding-bottom: 3px; border-bottom: 1px solid var(--ink); }
.unit { font-weight: 400; letter-spacing: 0; text-transform: none; color: var(--dim); font-size: 12px; }
h3 { color: var(--labelc); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; margin: 16px 0 4px; }
.note { color: var(--dim); font-size: 12px; margin: 4px 0 8px; }
.warn-line { color: var(--red); font-size: 13px; margin: 4px 0 8px; }
.empty { padding: 30px 0; color: var(--dim); }

/* Layout: asymmetric columns, sized by importance */
.split { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(280px, 1fr); gap: 0; align-items: start; }
.split > :last-child { border-left: 1px solid var(--ink); padding-left: 14px; }
.split > :last-child, .split-wide > :last-child { scrollbar-gutter: stable; box-sizing: border-box; }
.split-wide { display: grid; grid-template-columns: minmax(0, 2.4fr) minmax(300px, 1fr); gap: 0; align-items: start; }
@media (max-width: 900px) { .split, .split-wide { grid-template-columns: 1fr; } .masthead { grid-template-columns: 1fr; } .masthead .meta { justify-self: start; text-align: left; } }
.block { margin-bottom: 18px; }

/* Ruled tables */
table { border-collapse: collapse; width: 100%; }
table.fixed { table-layout: fixed; }
table.fixed td, table.fixed th { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
th, td { padding: 2px 6px; border-bottom: 1px solid var(--rule); vertical-align: baseline; text-align: left; }
th { color: var(--labelc); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; border-bottom: 1px solid var(--ink); white-space: nowrap; cursor: pointer; position: sticky; top: 0; background: var(--paper); }
th.n { font-family: var(--label); }
th, th.n { text-align: center; }
td { font-size: 13px; }
td:first-child, th:first-child { padding-left: 0; }
tbody tr.sel td { background: var(--faint); }
tbody tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--ink); padding-left: 6px; }
tbody tr.pointer { cursor: pointer; }
table.cmp tbody tr:last-child td { border-bottom: none; }
tbody tr.grp td { cursor: pointer; padding-top: 8px; font-weight: 700; color: var(--labelc); border-bottom: 1px solid var(--ink); }
tbody tr.grp .fold { display: inline-block; width: 1.2em; font-family: var(--figure); }
tbody tr.grp .fig { float: right; font-weight: 400; color: var(--dim); }
tbody tr.pointer:hover td { background: var(--faint); }
.scroll { max-height: 560px; overflow: auto; padding-right: 10px; }
.scroll.indent { margin-left: 18px; }
.scroll.fill { max-height: none; }
.scroll { scrollbar-gutter: stable; }
.breach { color: var(--red); font-weight: 700; }
.state { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
.state.play { color: var(--red); font-weight: 700; }
td.u { color: var(--dim); font-size: 12px; width: 1%; white-space: nowrap; }

/* Figures table (metric, value, unit) */
table.figures td.metric { color: var(--labelc); }
table.figures td.v { font-family: var(--figure); text-align: right; font-size: 15px; white-space: nowrap; }
table.figures .sub { color: var(--dim); font-size: 12px; }
table.figures.fixed td.metric { white-space: normal; }

/* Findings as timetable footnotes */
ol.notes { list-style: none; margin: 0; padding: 0; counter-reset: n; }
ol.notes li { counter-increment: n; display: grid; grid-template-columns: 26px 74px 1fr; gap: 0 8px; padding: 5px 0; border-bottom: 1px solid var(--rule); font-size: 14px; }
ol.notes li::before { content: counter(n); font-family: var(--figure); color: var(--dim); text-align: right; }
ol.notes .lvl { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding-top: 2px; color: var(--dim); }
ol.notes li.info .lvl { color: var(--blue); font-weight: 700; }
ol.notes li.warn .lvl { color: var(--yellow); font-weight: 700; }
ol.notes li.suspect .lvl { color: var(--red); font-weight: 700; }

.kv { display: grid; grid-template-columns: 138px minmax(0, 1fr); gap: 0 14px; font-size: 13px; }
.kv > div { padding: 2px 0; border-bottom: 1px solid var(--rule); min-height: 1.6em; overflow: hidden; text-overflow: ellipsis; }
.kv > div:nth-child(odd) { color: var(--labelc); }
.kv > div:nth-child(even) { font-family: var(--figure); }
ul.modlist { list-style: none; margin: 0; padding: 0 10px 0 0; max-height: 320px; overflow-y: auto; scrollbar-gutter: stable; }
ul.modlist.fill { max-height: none; }
ul.modlist li { display: grid; grid-template-columns: 1fr auto; gap: 0 12px; padding: 2px 6px 2px 0; border-bottom: 1px solid var(--rule); font-size: 13px; }
ul.modlist li:last-child { border-bottom: none; }
ul.modlist .fig { font-size: 12px; color: var(--dim); text-align: right; }

/* Charts: no borders, direct labels */
.chart { position: relative; margin: 2px 0 14px; }
.chart .ct { color: var(--labelc); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; border-bottom: 1px solid var(--ink); padding-bottom: 2px; }
.chart canvas { width: 100%; display: block; }
.chart .cd { font-size: 12px; color: var(--dim); margin: 2px 0 0; }
.tip { position: absolute; pointer-events: none; background: var(--paper); border: 1px solid var(--ink); padding: 4px 6px; font: 12px/1.35 var(--figure); white-space: nowrap; z-index: 4; display: none; }
.hint { font-size: 12px; color: var(--dim); margin: 0 0 6px; }
.row { display: flex; gap: 14px; flex-wrap: wrap; align-items: center; margin: 4px 0 8px; font-size: 13px; }
label.inline { display: inline-flex; gap: 5px; align-items: center; }
label.inline input { margin: 0; }
.stcount { display: inline-flex; align-items: baseline; gap: 6px; }
.stcount .fig { font-size: 12px; }
.placeholder { color: var(--dim); opacity: .7; font-size: 12px; padding: 4px 0; }
.hintrow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 14px; }
input[type=checkbox] { accent-color: var(--ink); margin: 0; }

/* Detail panel */
.detail { border-left: 1px solid var(--ink); padding-left: 14px; font-size: 13px; }
.detail .big { font-family: var(--figure); font-size: 26px; line-height: 1; }

/* Markdown and text */
.md h1 { font-size: 20px; margin: 4px 0 10px; }
.md h2 { margin-top: 18px; }
.md table { margin: 4px 0 12px; }
.md td { font-size: 12px; }
/* Summary tables: the same fixed column widths in every table, so their columns line up down the page. */
.md table { width: auto; }
.md table.aligned { table-layout: fixed; }
.md td:first-child { text-align: left; }
.md td { white-space: nowrap; }
.md th { white-space: nowrap; }
.md p.label { color: var(--labelc); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; font-weight: 700; margin: 14px 0 4px; }
.md td.n { font-family: var(--figure); }
.md code { font-family: var(--figure); font-size: 12px; }
.md ul { padding-left: 18px; margin: 4px 0 10px; }
textarea { width: 100%; min-height: 200px; display: block; resize: none; font: 12px/1.45 var(--figure); color: var(--ink); background: var(--promptbg); border: 1px solid var(--rule-strong); border-radius: 0; padding: 8px; }
.note.disclaimer { margin: 0 0 8px; color: var(--dim); font-size: 12px; }
footer { margin-top: 14px; padding-top: 6px; border-top: 1px solid var(--rule); font-size: 12px; color: var(--dim); }
</style>
</head>
<body>
<header class="masthead">
  <div class="title">MH Performance Analyzer</div>
  <div class="picker"><label for="sessionSel">Session</label><select id="sessionSel" disabled></select></div>
  <div class="meta" id="status"></div>
</header>
<nav id="tabs">
  <button data-tab="overview" class="on">Findings and steady play</button>
  <button data-tab="timeline">Timeline record</button>
  <button data-tab="spikes">Spikes</button>
  <button data-tab="mods">Mod time</button>
  <button data-tab="compare">Session comparison</button>
  <button data-tab="summary">Summary</button>
  <button data-tab="ai">ai-report.md</button>
</nav>
<main>
  <section class="tab on" id="tab-overview"><div class="empty">No session in this page.</div></section>
  <section class="tab" id="tab-timeline"></section>
  <section class="tab" id="tab-spikes"></section>
  <section class="tab" id="tab-mods"></section>
  <section class="tab" id="tab-compare"></section>
  <section class="tab" id="tab-summary"></section>
  <section class="tab" id="tab-ai"></section>
</main>
<footer>MH Performance Analyzer © 2026 MuerteHorrible. All rights reserved. This page works offline and reads nothing from your computer: every figure it shows is stored inside the page.</footer>
<script>
"use strict";
// ---------- helpers ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmt = (v, d = 2) => (v == null || !isFinite(v)) ? "-" : Number(v).toFixed(d);
const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const SPIKE_LIMIT = 33.3;

function parseCSV(text) {
  const rows = []; let row = [], field = "", q = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (q) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else q = false; }
      else field += c;
    } else if (c === '"') q = true;
    else if (c === ",") { row.push(field); field = ""; }
    else if (c === "\n" || c === "\r") {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(field); field = "";
      if (row.length > 1 || row[0] !== "") rows.push(row);
      row = [];
    } else field += c;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  if (!rows.length) return [];
  const head = rows[0];
  return rows.slice(1).map(r => {
    const o = {};
    head.forEach((h, i) => { const v = r[i]; o[h] = (v === undefined || v === "") ? null : (isNaN(+v) ? v : +v); });
    return o;
  });
}
function parseJSONL(text) {
  const out = [];
  for (const line of text.split(/\r?\n/)) { if (!line.trim()) continue; try { out.push(JSON.parse(line)); } catch (e) { } }
  return out;
}
// opts.state: { key, dir } kept by the caller, so the sort survives a redraw.
// opts.group: row => group name. Groups are listed by size, largest first, each under a heading row with its count;
// the column sort applies inside each group. opts.folded: Set of folded group names (click a heading to fold it).
function sortable(table, rows, cols, onRow, initKey = null, initDir = -1, opts = {}) {
  const st = opts.state || { key: initKey, dir: initDir };
  const render = () => {
    const key = st.key, dir = st.dir;
    let sorted = key == null ? rows : [...rows].sort((a, b) => {
      const x = a[key], y = b[key];
      if (typeof x === "number" && typeof y === "number") return (x - y) * dir;
      return String(x ?? "").localeCompare(String(y ?? "")) * dir;
    });
    const rowHtml = r => `<tr class="${onRow ? "pointer" : ""}" data-i="${rows.indexOf(r)}">` + cols.map(c => `<td class="${c.n ? "n" : ""}" title="${esc(String(r[c.k] ?? ""))}">${c.f ? c.f(r[c.k], r) : esc(r[c.k])}</td>`).join("") + "</tr>";
    let body;
    if (opts.group) {
      const groups = new Map();
      for (const r of sorted) { const gname = opts.group(r); if (!groups.has(gname)) groups.set(gname, []); groups.get(gname).push(r); }
      const order = [...groups.entries()].sort((p, q) => q[1].length - p[1].length || p[0].localeCompare(q[0]));
      body = order.map(([gname, list]) => {
        const folded = opts.folded && opts.folded.has(gname);
        const share = rows.length ? Math.round(list.length / rows.length * 100) : 0;
        return `<tr class="grp" data-g="${esc(gname)}"><td colspan="${cols.length}"><span class="fold">${folded ? "+" : "-"}</span>${esc(gname)}<span class="fig">${list.length} ${list.length === 1 ? "spike" : "spikes"}, ${share}%</span></td></tr>` +
          (folded ? "" : list.map(rowHtml).join(""));
      }).join("");
    } else body = sorted.map(rowHtml).join("");
    // Fixed layout: widths come from the colgroup, never from the text, so columns stay put.
    // The sort arrow has its own fixed slot, so sorting never changes a heading's width.
    table.classList.add("fixed");
    table.innerHTML = "<colgroup>" + cols.map(c => `<col style="${c.w ? "width:" + c.w : ""}">`).join("") + "</colgroup><thead><tr>" +
      cols.map(c => `<th class="${c.n ? "n" : ""}" data-k="${c.k}" title="${esc(c.label)}">${esc(c.label)}<span style="display:inline-block;width:1em;text-align:center">${key === c.k ? (dir > 0 ? "↑" : "↓") : ""}</span></th>`).join("") + "</tr></thead><tbody>" +
      body + "</tbody>";
    table.querySelectorAll("th").forEach(th => th.onclick = () => { const k = th.dataset.k; if (st.key === k) st.dir = -st.dir; else { st.key = k; st.dir = -1; } render(); });
    table.querySelectorAll("tr.grp").forEach(tr => tr.onclick = () => { const gname = tr.dataset.g; if (!opts.folded) return; if (opts.folded.has(gname)) opts.folded.delete(gname); else opts.folded.add(gname); render(); });
    if (onRow) table.querySelectorAll("tbody tr[data-i]").forEach(tr => tr.onclick = () => { table.querySelectorAll("tr.sel").forEach(x => x.classList.remove("sel")); tr.classList.add("sel"); onRow(rows[+tr.dataset.i]); });
  };
  render();
}
function figRow(metric, value, unit, sub, breach) {
  if (value == null || value === "undefined") value = "-";
  return `<tr><td class="metric">${esc(metric)}${sub ? `<div class="sub">${esc(sub)}</div>` : ""}</td><td class="v${breach ? " breach" : ""}">${value}</td><td class="u">${esc(unit || "")}</td></tr>`;
}
const stateLabel = st => st === "analyzer" ? "MH-PA" : st === "play" ? "gameplay" : st;
const stateCell = st => `<span class="state ${st === "play" ? "play" : ""}">${esc(stateLabel(st))}</span>`;

// ---------- light and dark mode (remembered in this browser only, when it allows it) ----------
function themeName() { return document.documentElement.dataset.theme === "dark" ? "dark" : "light"; }
function setTheme(name) {
  document.documentElement.dataset.theme = name;
  try { localStorage.setItem("mhpa-theme", name); } catch (e) { }
  const b = $("#themeBtn"); if (b) b.textContent = name === "dark" ? "Light mode" : "Dark mode";
  Charts.redrawAll();
}
function toggleTheme() { setTheme(themeName() === "dark" ? "light" : "dark"); }
try { if (localStorage.getItem("mhpa-theme") === "dark") document.documentElement.dataset.theme = "dark"; } catch (e) { }

// ---------- embedded data ----------
// Written by MH Performance Analyzer when a recording stops. Every figure this page shows is in ANALYZER_DATA below.
const ANALYZER_DATA = /*ANALYZER_DATA*/null;
let sessions = [];
const cache = new Map();

function sessionLabel(s) { return `${s.started || s.name}   ${s.minutes != null ? fmt(s.minutes, 1) + " min" : ""}   ${s.name}`; }
function visibleSessions() { return sessions; }
function minutesBetween(a, b) { if (!a || !b) return null; const t = s => Date.parse(s.replace(" ", "T")); const m = (t(b) - t(a)) / 60000; return isFinite(m) ? m : null; }
function initSessions() {
  sessions = (ANALYZER_DATA && ANALYZER_DATA.sessions) || [];
  for (const s of sessions) {
    const r = s.report || {}, ses = r.session || {}, info = s.sessionInfo || {};
    s.started = ses.startedLocal || info.startedLocal || ""; s.minutes = ses.durationMinutes ?? minutesBetween(info.startedLocal, info.endedLocal); s.version = r.analyzerVersion || "earlier version";
    s.final = !!ses.final; s.worldLoads = ses.worldLoads;
  }
  const sel = $("#sessionSel");
  sel.innerHTML = sessions.map(s => `<option value="${esc(s.name)}">${esc(sessionLabel(s))}</option>`).join("");
  sel.disabled = sessions.length < 2;
  sel.onchange = e => selectSession(e.target.value);
  if (sessions.length) selectSession(sessions[0].name);
  else $("#status").textContent = "no sessions";
}

// ---------- tabs (keys 1 to 7 switch too) ----------
// Makes an element reach the bottom of the window, just above the footer.
function fitToBottom() {
  // The page itself never scrolls: header, tabs and footer stay put and the open tab gets the space between.
  // A .fill element (or the Timeline charts) takes what is left below it, then gives back any overflow.
  const sec = $("section.tab.on");
  if (!sec) return;
  const bottom = () => sec.getBoundingClientRect().bottom;
  const over = () => sec.scrollHeight - sec.clientHeight;
  // Side columns scroll on their own, so a tall column never pushes the page.
  const wide = window.innerWidth > 900;
  sec.querySelectorAll(".split > :last-child, .split-wide > :last-child").forEach(el => {
    el.style.maxHeight = wide ? Math.max(120, bottom() - el.getBoundingClientRect().top) + "px" : "";
    el.style.overflowY = wide ? "auto" : "";
  });
  sec.querySelectorAll(".fill").forEach(el => {
    el.style.height = Math.max(120, bottom() - el.getBoundingClientRect().top) + "px";
    const o = over();
    if (o > 0) el.style.height = Math.max(120, el.offsetHeight - o) + "px";
  });
  // Timeline record: the charts share the height below them, in proportion to their usual heights.
  const host = sec.querySelector("#tlCharts");
  if (host) {
    const charts = Charts.list.filter(c => host.contains(c.wrap));
    if (charts.length) {
      const base = charts.reduce((s, c) => s + c.base, 0);
      const size = k => charts.forEach(c => { c.h = Math.max(60, Math.round(c.base * k)); c.draw(); });
      size(1);
      const spare = bottom() - host.getBoundingClientRect().bottom;
      size(Math.max(0.2, (base + spare) / base));
      const o = over();
      if (o > 0) size(Math.max(0.2, (base + spare - o) / base));
    }
  }
}
window.addEventListener("resize", () => fitToBottom());
function showTab(name) {
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x.dataset.tab === name));
  document.querySelectorAll("section.tab").forEach(x => x.classList.toggle("on", x.id === "tab-" + name));
  Charts.redrawAll();
  fitToBottom();
  if (name === "summary") alignSummaryTables();
}
$("#tabs").onclick = e => { const b = e.target.closest("button"); if (b) showTab(b.dataset.tab); };
document.addEventListener("keydown", e => {
  if (e.target.matches("input, textarea, select") || e.ctrlKey || e.altKey || e.metaKey) return;
  const tabs = [...document.querySelectorAll("#tabs button")], i = +e.key - 1;
  if (i >= 0 && i < tabs.length) showTab(tabs[i].dataset.tab);
});

// ---------- session data ----------
async function loadSession(name) {
  if (cache.has(name)) return cache.get(name);

function drawCompare(a, b) {
  const body = $("#cmpBody");
  Charts.list = Charts.list.filter(c => c.group !== "cmp");
  const A = a.steady, B = b.steady, checks = [];
  if (!A || !B) { body.innerHTML = `<div class="warn-line">One of the sessions has no steady play.</div>`; return; }
  const modsA = new Set(a.mods.map(m => m.id)), modsB = new Set(b.mods.map(m => m.id));
  const onlyA = [...modsA].filter(m => !modsB.has(m)), onlyB = [...modsB].filter(m => !modsA.has(m));
  checks.push({ ok: true, k: "mods", t: onlyA.length || onlyB.length ? `only in the last recorded session: ${onlyA.join(", ") || "none"}; only in the other: ${onlyB.join(", ") || "none"}` : "same mod set" });
  const cfgA = (a.system || {}).config || {}, cfgB = (b.system || {}).config || {};
  if (cfgA.perModTiming !== cfgB.perModTiming) checks.push({ ok: true, k: "perModTiming", t: `last recorded ${cfgA.perModTiming}, vs. ${cfgB.perModTiming}` });
  if (A.draw != null && B.draw != null) {
    const diff = Math.abs(A.draw - B.draw) / Math.max(A.draw, B.draw);
    checks.push({ ok: diff <= 0.05, k: "draw calls", t: diff > 0.05 ? `${fmt(A.draw, 0)} vs ${fmt(B.draw, 0)}, ${fmt(diff * 100, 0)}% apart: the views probably differ, so GPU and frame time differences may be the view, not the mods` : `${fmt(A.draw, 0)} vs ${fmt(B.draw, 0)}, match` });
  }
  if (A.cam && B.cam) {
    const dist = Math.hypot(A.cam.cam_x - B.cam.cam_x, A.cam.cam_y - B.cam.cam_y, A.cam.cam_z - B.cam.cam_z);
    const dy = Math.abs(((A.cam.cam_yaw - B.cam.cam_yaw + 540) % 360) - 180);
    checks.push({ ok: !(dist > 5 || dy > 5), k: "first view", t: dist > 5 || dy > 5 ? `${fmt(dist, 1)} m apart, yaw ${fmt(dy, 1)} degrees apart` : "same" });
  }
  const gap = Math.abs(A.spikes - B.spikes), lim = 2 * Math.sqrt(A.spikes + B.spikes);
  const beyond = gap > lim && A.spikes + B.spikes > 0;
  checks.push({ ok: !beyond, k: "play spikes", t: `${A.spikes} vs ${B.spikes}, ${beyond ? "difference beyond chance" : "within chance"} (limit about ${fmt(lim, 1)})` });
  const row = (k, unit, x, y, d = 2) => `<tr><td>${k}</td><td class="u">${unit}</td><td class="n">${fmt(x, d)}</td><td class="n">${fmt(y, d)}</td><td class="n">${y - x > 0 ? "+" : ""}${fmt(y - x, d)}</td></tr>`;
  body.innerHTML = `<div class="split">
      <div><h2>Steady play <span class="unit">difference: vs. minus last recorded</span></h2>
      <table class="fixed cmp"><colgroup><col><col style="width:78px"><col style="width:110px"><col style="width:86px"><col style="width:96px"></colgroup><thead><tr><th>metric</th><th></th><th class="n">last recorded</th><th class="n">vs.</th><th class="n">difference</th></tr></thead><tbody>
      ${row("frame time", "ms", A.ms, B.ms)}${row("frame rate", "fps", A.fps, B.fps, 1)}${row("p99, mean of seconds", "ms", A.p99, B.p99)}${row("cpu_main_ms", "ms", A.cpuMain, B.cpuMain)}${row("cpu_render_ms", "ms", A.cpuRender, B.cpuRender)}
      ${row("gpu_ms", "ms", A.gpu, B.gpu)}${row("garbage collections", "per min", A.gcPerMin, B.gcPerMin, 1)}${row("alloc_mb", "MB/s", A.alloc, B.alloc)}${row("draw_calls", "per frame", A.draw, B.draw, 0)}
      ${row("play spikes", "per min", A.spikesPerMin, B.spikesPerMin)}${row("steady time", "min", A.seconds / 60, B.seconds / 60, 1)}</tbody></table></div>
      <div><h2>Checks</h2><div class="kv">${checks.map(c => `<div>${esc(c.k)}</div><div class="${c.ok ? "" : "breach"}">${esc(c.t)}</div>`).join("")}</div></div>
    </div><div id="cmpCharts" style="margin-top:18px"></div>`;
  const pts = new Map();
  const add = (d, tag) => d.frames.forEach(r => { if (r._play == null || r.world !== 1) return; const k = Math.round(r._play); const o = pts.get(k) || { x: k }; o["ms" + tag] = r.ms_avg; o["main" + tag] = r.cpu_main_ms; o["gpu" + tag] = r.gpu_ms; o["max" + tag] = r.ms_max; o["load" + tag] = r.loading; pts.set(k, o); });
  add(a, "A"); add(b, "B");
  const data = [...pts.values()].sort((x, y) => x.x - y.x);
  if (data.length < 2) return;
  const dom = [data[0].x, data[data.length - 1].x], host = $("#cmpCharts");
  const shade = []; let st = null;
  for (const r of data) { const off = r.loadA === 1 || r.loadB === 1; if (off && st == null) st = r.x - 1; if (!off && st != null) { shade.push([st, r.x]); st = null; } }
  new Chart(host, { data, xKey: "x", xDomain: dom, group: "cmp", shade, threshold: { value: SPIKE_LIMIT, label: "33.3 ms" }, title: "ms_avg and ms_max", unit: "ms per frame, x: time since world load", desc: "Average and worst frame time per second for both sessions, lined up on time since each world loaded.", height: 180,
    series: [{ key: "msA", label: "last avg", weight: 2, c: 0 }, { key: "msB", label: "vs. avg", weight: 2, dash: [5, 3], c: 0 }, { key: "maxA", label: "last max", weight: 1, dim: true, clip: true, c: 1 }, { key: "maxB", label: "vs. max", weight: 1, dim: true, dash: [5, 3], clip: true, c: 1 }] });
  new Chart(host, { data, xKey: "x", xDomain: dom, group: "cmp", shade, title: "cpu_main_ms and gpu_ms", unit: "ms per frame", desc: "CPU main thread and GPU time per frame for both sessions.", height: 160,
    series: [{ key: "mainA", label: "last main", weight: 2, c: 0 }, { key: "mainB", label: "vs. main", weight: 2, dash: [5, 3], c: 0 }, { key: "gpuA", label: "last GPU", weight: 1.2, c: 2 }, { key: "gpuB", label: "vs. GPU", weight: 1.2, dash: [5, 3], c: 2 }] });
  Charts.redrawAll();
}

// Every column is as wide as its widest text, heading included and never wrapped. The first column has the same
// width in every table, and tables with the same headings (the two method tables) share all their widths, so they
// line up exactly. Measured once the Summary tab is visible.
function alignSummaryTables() {
  const host = $("#tab-summary .md");
  if (!host || host.dataset.aligned || !host.offsetParent) return;
  const tables = [...host.querySelectorAll("table")];
  const need = t => { const w = []; [...t.rows].forEach(r => [...r.cells].forEach((c, k) => { w[k] = Math.max(w[k] || 0, Math.ceil(c.getBoundingClientRect().width) + 14); })); return w; };
  const groups = new Map();
  tables.forEach(t => { const sig = [...t.tHead.rows[0].cells].map(c => c.textContent).join("|"); if (!groups.has(sig)) groups.set(sig, []); groups.get(sig).push(t); });
  const widths = new Map();
  for (const list of groups.values()) {
    const w = [];
    list.forEach(t => need(t).forEach((v, k) => { w[k] = Math.max(w[k] || 0, v); }));
    list.forEach(t => widths.set(t, w));
  }
  const first = Math.max(...tables.map(t => widths.get(t)[0] || 0));
  tables.forEach(t => {
    const w = widths.get(t).slice(); w[0] = first;
    [...t.querySelectorAll("col")].forEach((c, k) => { c.style.width = w[k] + "px"; });
    t.style.width = w.reduce((s, v) => s + v, 0) + "px";
    t.classList.add("aligned");
  });
  host.dataset.aligned = "1";
}
function md(text) {
  const lines = text.split(/\r?\n/); let out = "", i = 0;
  const inline = s => esc(s).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  const numeric = c => /^[-+]?[\d.,]+\s*(%|ms|MB|s|us|fps)?$/.test(c.trim()) || /^[?-]$/.test(c.trim());
  while (i < lines.length) {
    const l = lines[i];
    if (/^#{1,3} /.test(l)) { const n = l.match(/^#+/)[0].length; out += `<h${n}>${inline(l.slice(n + 1))}</h${n}>`; i++; continue; }
    if (/^\|/.test(l)) {
      const rows = []; while (i < lines.length && /^\|/.test(lines[i])) rows.push(lines[i++]);
      const cells = r => r.replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const head = cells(rows[0]);
      out += "<table><colgroup>" + head.map(() => "<col>").join("") + "</colgroup><thead><tr>" + head.map(c => `<th>${inline(c)}</th>`).join("") + "</tr></thead><tbody>" +
        rows.slice(2).map(r => "<tr>" + cells(r).map(c => `<td class="${numeric(c) ? "n" : ""}" title="${esc(c)}">${inline(c)}</td>`).join("") + "</tr>").join("") + "</tbody></table>"; continue;
    }
    if (/^- /.test(l)) { out += "<ul>"; while (i < lines.length && /^- /.test(lines[i])) out += `<li>${inline(lines[i++].slice(2))}</li>`; out += "</ul>"; continue; }
    // A short line ending in a colon introduces the table below it: shown as a label.
    if (l.trim()) out += /^[^.|]{3,60}:$/.test(l.trim()) ? `<p class="label">${inline(l.trim().slice(0, -1))}</p>` : `<p>${inline(l)}</p>`;
    i++;
  }
  return out;
}
initSessions();
</script>
</body>
</html>
